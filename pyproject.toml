[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physfunc"
version = "0.1.0"

description = "Functional data analysis methods for physiological signals"

readme = "README.md"

requires-python = ">=3.10"

authors = [
    {name = "Joao Kruse", email = "jkruse2607@gmail.com"}
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "pandas>=2.2",
]

keywords = [
    "functional-data-analysis",
    "circadian",
    "fpca",
    "biosignals",
    "heart-rate",
    "chronobiology",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
include = ["physfunc*"]